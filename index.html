const $=id=>document.getElementById(id), colors=['#d7c6a9','#856249','#454b48','#839384','#f1efea'], styleNames=['modern','classic','minimal'];
let language='ar',step=0,furthest=0,style='modern',colorIndex=0,photoURL=null,photoName='',before=false,photoGeneration=0;
const t=key=>translations[language][key];
function error(key=''){ $('error').textContent=key?t(key):''; }
function amount(n){return new Intl.NumberFormat(language==='en'?'en-US':language==='fa'?'fa-IR':'ar-IQ').format(n)+' IQD';}
function materialName(){return $('material').value==='mdf'?'MDF':t($('material').value);}
function layoutName(){return $('layout').value==='island'?t('island'):$('layout').value;}
function budgetValid(){if($('budget-unsure').checked)return true;const lo=$('budget-min'),hi=$('budget-max');return lo.value.trim()!==''&&hi.value.trim()!==''&&lo.validity.valid&&hi.validity.valid&&Number(lo.value)<=Number(hi.value);}
function validate(which){if(which===0&&!$('meters').validity.valid){error('invalidMeters');$('meters').focus();return false;}if(which===2&&!budgetValid()){error('invalidBudget');$('budget-min').focus();return false;}error();return true;}
function nav(){document.querySelector('.step-nav').replaceChildren();t('steps').forEach((name,i)=>{const b=document.createElement('button');b.className='step-link'+(i<step?' complete':'');b.disabled=i>furthest;b.setAttribute('aria-label',name);if(i===step)b.setAttribute('aria-current','step');const number=document.createElement('span');number.className='num';number.textContent=i<step?'✓':String(i+1).padStart(2,'0');const text=document.createElement('span');text.className='step-name';text.textContent=name;b.append(number,text);b.onclick=()=>go(i);document.querySelector('.step-nav').append(b);});$('step-counter').textContent=t('stepWord')+' '+(step+1)+' '+t('of')+' 5';const percentage=(step+1)*20;document.querySelector('.progress-fill').style.width=percentage+'%';document.querySelector('.progress-track').setAttribute('aria-valuenow',percentage);$('back').classList.toggle('hidden',step===0);$('next').classList.toggle('hidden',step===4);$('next').textContent=step===3?t('review'):t('next');document.querySelector('.navigation').classList.toggle('hidden',step===4);}
function go(target){if(target>step){for(let i=0;i<target;i++){if(!validate(i)){if(i!==step){step=i;show();}return;}}}step=target;furthest=Math.max(step,furthest);error();show();$('heading-'+step).focus({preventScroll:true});if(window.innerWidth<760)document.querySelector('.workspace').scrollIntoView({behavior:'smooth',block:'start'});}
function show(){document.querySelectorAll('.step').forEach((el,i)=>{el.classList.toggle('active',i===step);el.inert=i!==step;});nav();render();if(step===4)summary();}
function translate(){document.documentElement.lang=language;document.documentElement.dir=language==='en'?'ltr':'rtl';document.title='KitchenVision — '+t('summaryTitle');document.querySelectorAll('[data-t]').forEach(el=>el.textContent=t(el.dataset.t));document.querySelectorAll('[data-placeholder]').forEach(el=>el.placeholder=t(el.dataset.placeholder));document.querySelectorAll('#colors button').forEach((el,i)=>el.setAttribute('aria-label',t('colorNames')[i]));document.querySelectorAll('#priorities span').forEach((el,i)=>el.textContent=t('priorityNames')[i]);$('uploaded-photo').alt=t('reference');$('reference-image').alt=t('reference');error();$('export-status').textContent='';show();}
function render(){const meters=Number($('meters').value),valid=$('meters').validity.valid&&$('meters').value!=='';const mat=$('material').value,layout=$('layout').value;const rates={mdf:350000,gloss:450000,wood:650000};$('price').textContent=valid?amount(Math.round(meters*rates[mat]*(layout==='island'?1.3:layout==='U'?1.2:1))):'—';$('preview-style').textContent=t(style);$('preview-material').textContent=materialName();$('preview-meters').textContent=valid?new Intl.NumberFormat(language).format(meters):'—';$('color-name').textContent=t('colorNames')[colorIndex];const scene=$('scene');scene.style.setProperty('--cab',colors[colorIndex]);scene.className='scene '+style+' '+mat+(before?' before':'');$('toggle').textContent=before?t('showDesign'):t('toggle');$('islandGroup').style.display=layout==='island'?'block':'none';$('lower').style.opacity=layout==='I'?'.65':'1';$('upper').style.opacity=layout==='I'?'.65':'1';document.querySelectorAll('.layout-return').forEach(el=>{el.style.display=(layout==='L'||layout==='U')?'block':'none';});document.querySelectorAll('.layout-left').forEach(el=>{el.style.display=layout==='U'?'block':'none';});}
function values(){const selected=[...document.querySelectorAll('#priorities input:checked')].map(el=>t('priorityNames')[Number(el.value)]);return [[t('summaryPhoto'),photoURL?t('localPhoto'):t('noPhoto')],[t('summaryLayout'),layoutName()],[t('metersLabel'),$('meters').value],[t('styleLabel'),t(style)],[t('colorLabel'),t('colorNames')[colorIndex]],[t('materialLabel'),materialName()],[t('summaryBudget'),$('budget-unsure').checked?t('notSet'):amount(Number($('budget-min').value))+' – '+amount(Number($('budget-max').value))],[t('summaryPriority'),selected.length?selected.join(' / '):t('notSet')],[t('summaryNotes'),$('notes').value.trim()||t('notSet')],[t('samplePrice'),$('price').textContent]];}
function summary(){$('summary').replaceChildren();values().forEach(([k,v])=>{const row=document.createElement('div');row.className='summary-row';const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=v;row.append(dt,dd);$('summary').append(row);});}
function brief(){return 'KitchenVision — '+t('summaryTitle')+'\n\n'+values().map(([k,v])=>k+': '+v).join('\n')+'\n\n'+t('conceptNotice')+'\n'+t('sampleDisclaimer')+'\n'+t('nextStep');}
colors.forEach((c,i)=>{const b=document.createElement('button');b.className='swatch';b.style.setProperty('--swatch',c);b.setAttribute('aria-pressed',i===0?'true':'false');b.onclick=()=>{colorIndex=i;document.querySelectorAll('#colors button').forEach((el,j)=>el.setAttribute('aria-pressed',j===i?'true':'false'));render();};$('colors').append(b);});
for(let i=0;i<6;i++){const label=document.createElement('label');label.className='check-row';const input=document.createElement('input');input.type='checkbox';input.value=i;const text=document.createElement('span');label.append(input,text);input.onchange=()=>{if(document.querySelectorAll('#priorities input:checked').length>3){input.checked=false;error('priorityLimit');}else error();};$('priorities').append(label);}
document.querySelectorAll('[data-style]').forEach(b=>{b.onclick=()=>{style=b.dataset.style;document.querySelectorAll('[data-style]').forEach(el=>el.setAttribute('aria-pressed',el===b?'true':'false'));render();};});
const svgEl=document.querySelector('#scene svg'),ns='http://www.w3.org/2000/svg';
const defs=svgEl.querySelector('defs');const filter=document.createElementNS(ns,'filter');filter.id='woodTexture';filter.innerHTML='<feTurbulence type="fractalNoise" baseFrequency=".035 .55" numOctaves="2" seed="4" result="noise"/><feComposite in="noise" in2="SourceAlpha" operator="in" result="grainNoise"/><feBlend in="SourceGraphic" in2="grainNoise" mode="soft-light"/>';defs.append(filter);
const woodgrain=document.createElementNS(ns,'g');woodgrain.setAttribute('class','cabinet woodgrain');for(const [x,y,w,h] of [[95,112,235,120],[570,112,225,120],[70,296,260,118],[570,296,260,118]]){const rect=document.createElementNS(ns,'rect');for(const [key,val] of Object.entries({x,y,width:w,height:h,fill:'url(#grain)'}))rect.setAttribute(key,val);woodgrain.append(rect);}svgEl.append(woodgrain);const frames=document.createElementNS(ns,'g');frames.setAttribute('class','cabinet frame-inset');frames.setAttribute('fill','none');frames.setAttribute('stroke','#746450');frames.setAttribute('stroke-opacity','.45');for(const y of [120,304])for(const x of [103,183,260,578,653,728]){const r=document.createElementNS(ns,'rect');r.setAttribute('x',x);r.setAttribute('y',y);r.setAttribute('width','57');r.setAttribute('height','96');frames.append(r);}svgEl.append(frames);
for(const [d,cls] of [['M70 310L12 343V452L70 414Z','layout-left'],['M830 310L888 343V452L830 414Z','layout-return']]){const p=document.createElementNS(ns,'path');p.setAttribute('d',d);p.setAttribute('fill','var(--cab)');p.setAttribute('stroke','#786b59');p.setAttribute('stroke-opacity','.5');p.setAttribute('class','cabinet '+cls);svgEl.append(p);}
function clearPhoto(){photoGeneration++;if(photoURL)URL.revokeObjectURL(photoURL);photoURL=null;photoName='';$('photo').value='';$('filename').textContent='';$('uploaded-photo').removeAttribute('src');$('reference-image').removeAttribute('src');$('photo-review').style.display='none';$('photo-reference').style.display='none';}
$('photo').onchange=async e=>{const file=e.target.files[0];if(!file)return;const allowed=['image/jpeg','image/png','image/webp'];if(!allowed.includes(file.type)||file.size>8*1024*1024){error('invalidPhoto');e.target.value='';return;}const candidate=URL.createObjectURL(file),generation=++photoGeneration;const image=new Image();try{image.src=candidate;await image.decode();if(generation!==photoGeneration){URL.revokeObjectURL(candidate);return;}if(photoURL)URL.revokeObjectURL(photoURL);photoURL=candidate;photoName=file.name;$('uploaded-photo').src=photoURL;$('reference-image').src=photoURL;$('filename').textContent=photoName;$('photo-review').style.display='block';$('photo-reference').style.display='block';error();}catch{URL.revokeObjectURL(candidate);if(generation===photoGeneration){error('decodePhoto');$('photo').value='';}}};
$('remove-photo').onclick=()=>{clearPhoto();error();};$('lang').onchange=e=>{language=e.target.value;translate();};$('next').onclick=()=>go(step+1);$('back').onclick=()=>go(step-1);$('toggle').onclick=()=>{before=!before;render();};['layout','material','meters'].forEach(id=>$(id).addEventListener('input',()=>{error();render();}));
function budgetState(){const unsure=$('budget-unsure').checked;['budget-min','budget-max'].forEach(id=>{$(id).disabled=unsure;$(id).required=!unsure;});error();} $('budget-unsure').onchange=budgetState;
$('download').onclick=()=>{if(!validate(0)||!validate(2))return;const url=URL.createObjectURL(new Blob([brief()],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='KitchenVision-project-brief.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000);$('export-status').textContent=t('downloaded');};
$('print').onclick=()=>{summary();window.print();};$('share').onclick=()=>{const url='https://wa.me/?text='+encodeURIComponent(brief());const opened=window.open(url,'_blank');if(opened)opened.opener=null;$('export-status').textContent=t(opened?'shareNote':'shareBlocked');};
$('restart').onclick=()=>{if(!window.confirm(t('resetConfirm')))return;clearPhoto();$('meters').value=5;$('layout').value='L';$('material').value='mdf';style='modern';colorIndex=0;before=false;$('budget-min').value='';$('budget-max').value='';$('budget-unsure').checked=true;budgetState();$('notes').value='';document.querySelectorAll('#priorities input').forEach(el=>el.checked=false);document.querySelectorAll('[data-style]').forEach(el=>el.setAttribute('aria-pressed',el.dataset.style==='modern'?'true':'false'));document.querySelectorAll('#colors button').forEach((el,i)=>el.setAttribute('aria-pressed',i===0?'true':'false'));step=furthest=0;$('export-status').textContent='';show();$('heading-0').focus();};
window.addEventListener('beforeunload',()=>{if(photoURL)URL.revokeObjectURL(photoURL);});$('meters').required=true;budgetState();translate();
</script></body></html>
